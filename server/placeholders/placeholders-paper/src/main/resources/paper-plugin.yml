name: simplecloud-placeholder
version: ${version}
main: app.simplecloud.plugin.placeholders.paper.PaperPlaceholdersPlugin
api-version: "1.21.11"
author: SimpleCloud Maintainers
description: Provides SimpleCloud placeholders for PlaceholderAPI and MiniPlaceholders
website: https://github.com/simplecloudapp/simplecloud-plugins
folia-supported: true

dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    MiniPlaceholders:
      load: BEFORE
      required: false
      join-classpath: true
    simplecloud-api:
      load: BEFORE
      required: true
      join-classpath: true
