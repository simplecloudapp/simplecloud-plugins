# Example SimpleCloud NPC menu.
# Reference it from an NPC via:  /scnpcs edit <npc-id> action open-inventory right_click public example
# or open it directly, e.g. from a compass item:  /scnpcs inventory open example
# This file is only written once, on the very first start, edit or delete it freely.

version: 1
id: example
title: "Servers"
rows: 5
# Optional: only players with this permission can open the menu.
# open-permission: lobby.servers
# Optional: played once when the menu opens.
open-sound: UI_BUTTON_CLICK

# Every slot is just an item. Give one a `live-group` and it becomes a "Live Slot":
# its own material/name/lore/actions become the template for whatever `live` matches,
# and every other slot sharing the same live-group forms one paginated, live-updating
# list with it; servers appearing/stopping and player counts tick live while the menu
# is open. In-game, open the canvas (/scnpcs inventory edit <id>), click "New Live
# Group" in the toolbox under the menu, and drag the swatch across the slots it
# should fill; or hand-author them here.
items:
  # Only players with the permission see this item at all.
  # - slot: 4
  #   material: DIAMOND
  #   name: "<brand>VIP Lounge"
  #   view-permission: lobby.vip
  #   actions:
  #     - send-to-server: "VIP-1"
  #       cooldown: 3000

  # The 14 slots below are one live group ("servers") in the inner seven columns.
  # Only the first slot needs the `live:` block, it's the shared filter for the whole
  # group. Every slot has its own look, resolved per matched server via <entry_*>
  # placeholders: <entry_name>, <entry_numerical_id>, <entry_state>,
  # <entry_online_players>, <entry_max_players>, <entry_motd>, <entry_property:key>, ...
  - slot: 10
    live-group: servers
    live:
      # Built-in sources: group-servers, persistent-servers, groups, static.
      type: group-servers
      # "<target>" (or omitting `group`) resolves the opening NPC's first target group;
      # put an explicit group name here to always show that group instead.
      group: "<target>"
      # ServerState filter; empty = everything except STOPPING/CLEANUP.
      states: [AVAILABLE, INGAME]
      # NUMERICAL_ID (default) or PLAYER_COUNT.
      sort: NUMERICAL_ID
      # How an entry looks per server state; unset fields keep the slot's own look.
      # The icon shows the state at a glance: lime to join, orange while a round runs,
      # red when full.
      # States: AVAILABLE, FULL, STARTING, INGAME (and OFFLINE for groups/persistent servers).
      looks:
        FULL:
          material: RED_CONCRETE
          lore:
            - "<muted>Players: <highlight><entry_online_players>/<entry_max_players>"
            - ""
            - "<error>This server is full."
        INGAME:
          material: ORANGE_CONCRETE
          lore:
            - "<muted>Players: <highlight><entry_online_players>/<entry_max_players>"
            - ""
            - "<warning>A round is running."
    material: LIME_CONCRETE
    name: "<brand><entry_group_name>-<entry_numerical_id>"
    lore:
      - "<muted>Players: <highlight><entry_online_players>/<entry_max_players>"
      - "<muted>State: <highlight><entry_state>"
      - ""
      - "<interactive>Click to join"
    # Optional: what to click-do per entry. Omitted here, so the source default
    # applies; for server sources that is: connect to exactly the clicked server.
    # actions:
    #   - send-to-server: "<entry_server>"

    # Shown in the first slot while no server matches. Also only meaningful on the
    # first slot.
    when-empty:
      material: GRAY_DYE
      name: "<muted>No Servers Online"
  - { slot: 11, live-group: servers, material: LIME_CONCRETE }
  - { slot: 12, live-group: servers, material: LIME_CONCRETE }
  - { slot: 13, live-group: servers, material: LIME_CONCRETE }
  - { slot: 14, live-group: servers, material: LIME_CONCRETE }
  - { slot: 15, live-group: servers, material: LIME_CONCRETE }
  - { slot: 16, live-group: servers, material: LIME_CONCRETE }
  - { slot: 19, live-group: servers, material: LIME_CONCRETE }
  - { slot: 20, live-group: servers, material: LIME_CONCRETE }
  - { slot: 21, live-group: servers, material: LIME_CONCRETE }
  - { slot: 22, live-group: servers, material: LIME_CONCRETE }
  - { slot: 23, live-group: servers, material: LIME_CONCRETE }
  - { slot: 24, live-group: servers, material: LIME_CONCRETE }
  - { slot: 25, live-group: servers, material: LIME_CONCRETE }

  # Shown only when there are more servers than group slots, in the first and the
  # last slot of the bottom row.
  - slot: 36
    live-group: servers
    page-control: previous
    material: BLUE_STAINED_GLASS_PANE
    name: "<interactive>Previous Page"
  - slot: 44
    live-group: servers
    page-control: next
    material: BLUE_STAINED_GLASS_PANE
    name: "<interactive>Next Page"

  # More examples (commented out):
  #
  # A live group listing every group; clicking joins the emptiest AVAILABLE server of it.
  # - slot: 19
  #   live-group: groups
