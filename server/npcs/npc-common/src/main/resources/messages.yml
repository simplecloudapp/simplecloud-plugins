# ───────────────────────────────────────────────────────────────────────────────
# Palette
# Colors used throughout the messages, holograms and menus. Every entry is a tag,
# e.g. <brand>text or <error>text.
# ───────────────────────────────────────────────────────────────────────────────
palette:
  brand: '#3B95FF'
  interactive: '#62ADFF'
  highlight: '#CFE4FF'
  muted: '#A8A8AB'
  separator: '#5F5F63'
  info: '#4FA3FF'
  success: '#6AD13C'
  warning: '#FF9029'
  error: '#F5464F'
  mint: '#1FD98E'
  violet: '#9566FF'
  pink: '#E94BA6'
  gold: '#F2C230'
  cyan: '#22C3DB'
  amber: '#FFA329'

variables:
  prefix: '<brand><b>⚡</b></brand>'

command:
  help:
    title: '<prefix> <info>NPC commands'
    topic-title: '<prefix> <info>NPC commands: <topic>'
    unknown: '<prefix> <error>There is no help topic like that. Try one of <topics>.'
  reload:
    success: '<prefix> <success>Reloaded the NPCs!'
    failed: '<prefix> <error>Couldn''t reload the NPCs. Check the console.'
  npc:
    create:
      success: '<prefix> <success>Created NPC <id>!'
      failed: '<prefix> <error>Couldn''t create the NPC<detail-suffix>'
    link:
      success: '<prefix> <success>Linked NPC <id>.'
    unlink:
      success: '<prefix> <success>Unlinked NPC <id>.'
    duplicate:
      success: '<prefix> <success>Duplicated the NPC as <id>.'
    delete:
      success: '<prefix> <success>Deleted NPC <id>.'
    update:
      success: '<prefix> <success>Updated NPC <id>.'
    error:
      not-found: '<prefix> <error>NPC <detail> was not found.'
      already-exists: '<prefix> <error>NPC <detail> already exists.'
      invalid-id: '<prefix> <error><detail> is not a valid NPC id.'
      not-linked: '<prefix> <error>NPC <detail> is not linked. Use delete instead.'
  provider:
    error:
      unavailable: '<prefix> <error>Provider <detail> is not available.'
      external-npc-missing: '<prefix> <error>The provider has no NPC <detail>.'
      already-linked: '<prefix> <error>Provider NPC <detail> is already linked.'
  target:
    error:
      not-found: '<prefix> <error>Target <detail> was not found.'
      ambiguous: '<prefix> <error>Target <detail> is both a group and a persistent server. Rename one of them.'
      already-used: '<prefix> <error>This NPC already uses target <detail>.'
      limit: '<prefix> <error>This NPC already has the most targets it can have (<detail>).'

player:
  action:
    no-permission: '<prefix> <error>You don''t have permission to do that.'

# Help pages can be overridden per topic; the plugin's built-in pages are used when a
# topic is missing here. Topics: main, create, link, edit, target, hologram, action,
# pushback, admin, inventory.
#   help:
#     pages:
#       main:
#         - '<separator>•</separator> <interactive>/scnpcs create <id> <target>'
