name: 'empty_default'
rule: 'EMPTY'
priority: 10
behind-block: 'LIME_CONCRETE'
frame-update-interval: 1000

frames:
  - lines:
      - '<color:#4ade80>✨</color>'
      - '<server-name>'
      - '<color:#4ade80><b>EMPTY</b></color>'
      - '<player-count>/<max-players>'
  - lines:
      - '<color:#4ade80>✨</color>'
      - '<server-name>'
      - '<color:#4ade80><b>JOIN NOW!</b></color>'
      - '<player-count>/<max-players>'
