# The messages format version. Do not change this value.
version: 1

# ───────────────────────────────────────────────────────────────────────────────
# Palette
# Colors used throughout the messages. Every entry is a tag, e.g. <brand>text or <error>text.
# ───────────────────────────────────────────────────────────────────────────────
palette:
  brand: '#3B95FF'
  interactive: '#62ADFF'
  highlight: '#CFE4FF'
  muted: '#A1A7B5'
  separator: '#5F5F63'
  info: '#4FA3FF'
  success: '#6AD13C'
  warning: '#FF9029'
  error: '#FF3B30'
  mint: '#1FD98E'
  violet: '#9566FF'
  pink: '#E94BA6'
  gold: '#F2C230'
  cyan: '#22C3DB'
  amber: '#FFA329'

# ───────────────────────────────────────────────────────────────────────────────
# Variables
# Reusable variables that can be used throughout the messages.
# Usage: <variable_name> will be replaced with the defined value.
# ───────────────────────────────────────────────────────────────────────────────
variables:
  prefix: '<brand><b>⚡</b></brand>'

# ───────────────────────────────────────────────────────────────────────────────
# Command Messages
# ───────────────────────────────────────────────────────────────────────────────
command:
  help:
    title: '<prefix> <info>Sign commands  <separator>/scsigns'
    entry: '   <interactive><subcommand></interactive> <muted><arguments>'
    hover: '<highlight><description><br><muted>Usage: <highlight><usage><br><br><interactive>Click to type this command'
    # Shown next to each command and in its hover, keyed by the usage without /scsigns.
    descriptions:
      'add group <group>': 'Turn this sign into a group sign'
      'add persistent <name>': 'Turn this sign into a server sign'
      'remove [group|persistent server]': 'Remove this sign or all of a target'
      'list [page] [group|persistent server]': 'List the registered signs'

  add:
    success: '<prefix> <success>Created a sign for <target>!'
    already-registered: '<prefix> <warning>This sign is already registered.'
    group-not-found: '<prefix> <error>There is no group named <group>.'
    persistent-server-not-found: '<prefix> <error>There is no persistent server named <persistent-server>.'

  remove:
    success: '<prefix> <success>Removed the sign.'
    not-registered: '<prefix> <warning>This sign is not registered.'
    all-success: '<prefix> <success>Removed the signs of <target> <separator>(</separator><muted><amount></muted><separator>)</separator>.'
    none-registered: '<prefix> <warning>No signs are registered for <target>.'

  # <teleport>...</teleport> teleports the player to the sign when clicked.
  # <previous> and <next> are only shown if there is a previous or next page.
  list:
    empty: '<prefix> <warning>No signs are registered.'
    title: '<prefix> <info>Signs <separator>(</separator><muted><amount></muted><separator>)</separator>'
    entry: '<teleport><separator>•</separator> <interactive><target> <muted>in <world> at <x> <y> <z></teleport>'
    teleport-hover: '<interactive>Click to teleport'
    footer: '<previous><info>Page <page>/<pages><next>'
    previous: '<interactive>Previous</interactive>  '
    next: '  <interactive>Next'

  not-looking-at-sign: '<prefix> <error>Look at a sign to use this command.'

  exception:
    syntax: '<prefix> <error>Use <command> instead.'
    permission: '<prefix> <error>You don''t have permission to use this command.'
    invalid-sender: '<prefix> <error>You can''t use this command here.'
    failed: '<prefix> <error>The command failed because <reason>.'
    argument:
      invalid: '<prefix> <error>That argument is invalid: <reason>.'
      invalid-number: '<prefix> <error><value> is not a number.'
      number-too-small: '<prefix> <error>The number must be at least <min>.'
      number-too-large: '<prefix> <error>The number must be at most <max>.'
      invalid-boolean: '<prefix> <error>Use true or false.'
      invalid-enum: '<prefix> <error><value> is not an option. Use one of <options>.'
      invalid-uuid: '<prefix> <error><value> is not a valid UUID.'
