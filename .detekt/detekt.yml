complexity:
  TooManyFunctions:
    active: false
  LongParameterList:
    allowedFunctionParameters: 6
    allowedConstructorParameters: 8
    ignoreDefaultParameters: true
  LongMethod:
    allowedLines: 80
    excludes: ['**/test/**']
  CyclomaticComplexMethod:
    ignoreSimpleWhenEntries: true

coroutines:
  InjectDispatcher:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false

performance:
  SpreadOperator:
    active: false

style:
  ForbiddenComment:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  UnusedParameter:
    allowedNames: '^(ignored|expected|event|_)$'
  ForbiddenMethodCall:
    active: true
    methods:
      - 'kotlin.io.print'
      - 'kotlin.io.println'
      - 'java.math.BigDecimal.<init>(kotlin.Double)'
      - 'java.math.BigDecimal.<init>(kotlin.String)'
      - 'kotlin.system.measureTimeMillis'
      - 'kotlin.apply'
      - 'kotlin.also'
      - 'kotlin.let'
      - 'kotlin.run'
      - 'kotlin.with'
      - 'kotlin.takeIf'
      - 'kotlin.takeUnless'
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  ReturnCount:
    max: 3
    excludeGuardClauses: true
  ThrowsCount:
    max: 3
    excludeGuardClauses: true
  WildcardImport:
    active: false
