name: release and publish

on:
  push:
    tags:
      - "*/v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: release and publish
    runs-on: depot-ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: parse tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^([a-z0-9-]+)/v([0-9].*)$ ]]; then
            echo "::error::Tag '$TAG' does not match <plugin>/v<version>, e.g. command/v0.0.7"
            exit 1
          fi
          echo "plugin=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

      - name: check version
        env:
          PLUGIN: ${{ steps.tag.outputs.plugin }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          versions=$(find proxy server -path "*/${PLUGIN}-*/build.gradle.kts" \
            -exec sed -n 's/^version = "\(.*\)"$/\1/p' {} + | sort -u)
          if [ -z "$versions" ]; then
            echo "::error::No modules found for plugin '$PLUGIN'"
            exit 1
          fi
          if [ "$versions" != "$VERSION" ]; then
            echo "::error::Tag version '$VERSION' does not match the version in the build files: $(echo $versions)"
            exit 1
          fi

      - name: setup java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6

      - name: build
        env:
          DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }}
        run: ./gradlew assemble

      - name: publish to maven
        env:
          DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }}
          PLUGIN: ${{ steps.tag.outputs.plugin }}
          SIMPLECLOUD_USERNAME: ${{ secrets.SIMPLECLOUD_USERNAME }}
          SIMPLECLOUD_PASSWORD: ${{ secrets.SIMPLECLOUD_PASSWORD }}
        run: ./gradlew publishPlugin -Pplugin="$PLUGIN"

      - name: upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PLUGIN: ${{ steps.tag.outputs.plugin }}
        run: |
          shopt -s nullglob
          jars=(build/plugins/"$PLUGIN"/*.jar)
          if [ ${#jars[@]} -eq 0 ]; then
            echo "::error::No jars found in build/plugins/$PLUGIN"
            exit 1
          fi
          gh release upload "$TAG" "${jars[@]}" --clobber

