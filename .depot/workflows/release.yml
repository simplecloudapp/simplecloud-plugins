name: release and publish

on:
  push:
    tags:
      - "*/v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: release and publish
    runs-on: depot-ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: parse tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^([a-z0-9-]+)/v([0-9].*)$ ]]; then
            echo "::error::Tag '$TAG' does not match <plugin>/v<version>, e.g. command/v0.0.7"
            exit 1
          fi
          echo "plugin=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

      - name: check version
        env:
          PLUGIN: ${{ steps.tag.outputs.plugin }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          version=$(sed -n "s/^version\.${PLUGIN}=//p" gradle.properties)
          if [ -z "$version" ]; then
            echo "::error::No version.${PLUGIN} found in gradle.properties"
            exit 1
          fi
          if [ "$version" != "$VERSION" ]; then
            echo "::error::Tag version '$VERSION' does not match version.${PLUGIN} in gradle.properties: $version"
            exit 1
          fi

      - name: read changelog
        id: changelog
        env:
          PLUGIN: ${{ steps.tag.outputs.plugin }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          changelog=""
          for candidate in proxy/"$PLUGIN"/CHANGELOG.md server/"$PLUGIN"/CHANGELOG.md; do
            if [ -f "$candidate" ]; then
              changelog="$candidate"
            fi
          done
          if [ -z "$changelog" ]; then
            echo "::error::No CHANGELOG.md found for $PLUGIN"
            exit 1
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' "$changelog" | sed '/./,$!d' > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::No '## $VERSION' section in $changelog"
            exit 1
          fi
          echo "file=$notes" >> "$GITHUB_OUTPUT"

      - name: setup java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6

      - name: build
        env:
          DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }}
        run: ./gradlew assemble

      - name: publish to maven
        env:
          DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }}
          PLUGIN: ${{ steps.tag.outputs.plugin }}
          SIMPLECLOUD_USERNAME: ${{ secrets.SIMPLECLOUD_USERNAME }}
          SIMPLECLOUD_PASSWORD: ${{ secrets.SIMPLECLOUD_PASSWORD }}
        run: ./gradlew publishPlugin -Pplugin="$PLUGIN"

      - name: upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PLUGIN: ${{ steps.tag.outputs.plugin }}
          VERSION: ${{ steps.tag.outputs.version }}
          NOTES: ${{ steps.changelog.outputs.file }}
        run: |
          shopt -s nullglob
          jars=(build/plugins/"$PLUGIN"/*.jar)
          if [ ${#jars[@]} -eq 0 ]; then
            echo "::error::No jars found in build/plugins/$PLUGIN"
            exit 1
          fi
          # releases created in the github ui already exist, plain tag pushes need one
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$PLUGIN v$VERSION" --notes-file "$NOTES"
          fi
          gh release upload "$TAG" "${jars[@]}" --clobber

      - name: publish to modrinth
        env:
          DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PLUGIN: ${{ steps.tag.outputs.plugin }}
          NOTES: ${{ steps.changelog.outputs.file }}
        run: ./gradlew publishModrinth -Pplugin="$PLUGIN" -PchangelogFile="$NOTES"
