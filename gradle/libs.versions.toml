[versions]
# Kotlin
kotlin = "2.4.21"
kotlinx-coroutines = "1.11.0"

# Gradle Plugins
shadow = "9.6.1"
minotaur = "2.10.0"
blossom = "2.2.0"
spotless = "8.10.4"
detekt = "2.0.0-alpha.6"
paperweight = "2.0.0-beta.24"
protobuf = "0.10.0"

# SimpleCloud
simplecloud-api = "0.1.0-platform.59-dev.6.1-9cfd057"

# Platforms
velocity = "4.1.0-SNAPSHOT"
bungeecord = "1.21-R0.4"
waterdog = "2.0.4-SNAPSHOT"
paper = "26.3.build.+"
minestom = "26_3-SNAPSHOT"

# Platform Dependencies
placeholderapi = "2.12.3"
miniplaceholders = "3.2.0"
luckperms = "5.5"
reflection-remapper = "0.1.3"

# Libraries
adventure = "5.2.0"
configurate = "4.2.0"
caffeine = "3.3.1"
slf4j = "2.0.20"
jnats = "2.26.3"

# Protobuf
protoc = "4.36.2"
protobuf-kotlin = "4.36.2"

# Cloud Command
cloud = "2.1.0"
cloud-platform = "2.0.1"
cloud-minestom = "2.2.0-SNAPSHOT"

[libraries]
# Kotlin
kotlin-jvm = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

# Gradle Plugins
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
shadow-gradle-plugin = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "shadow" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
detekt-gradle-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
blossom-gradle-plugin = { module = "net.kyori:blossom", version.ref = "blossom" }
minotaur-gradle-plugin = { module = "com.modrinth.minotaur:Minotaur", version.ref = "minotaur" }

# SimpleCloud
simplecloud-api = { module = "app.simplecloud.api:api", version.ref = "simplecloud-api" }

# Platforms
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }
bungeecord-api = { module = "net.md-5:bungeecord-api", version.ref = "bungeecord" }
waterdog-api = { module = "dev.waterdog.waterdogpe:waterdog", version.ref = "waterdog" }
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
minestom = { module = "net.minestom:minestom", version.ref = "minestom" }

# Platform Dependencies
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
miniplaceholders-api = { module = "io.github.miniplaceholders:miniplaceholders-api", version.ref = "miniplaceholders" }
luckperms-api = { module = "net.luckperms:api", version.ref = "luckperms" }
reflection-remapper = { module = "xyz.jpenilla:reflection-remapper", version.ref = "reflection-remapper" }

# Libraries
adventure = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-text-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
adventure-text-serializer-gson = { module = "net.kyori:adventure-text-serializer-gson", version.ref = "adventure" }
adventure-text-serializer-plain = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "adventure" }
adventure-text-serializer-legacy = { module = "net.kyori:adventure-text-serializer-legacy", version.ref = "adventure" }
configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }
configurate-gson = { module = "org.spongepowered:configurate-gson", version.ref = "configurate" }
configurate-extra-kotlin = { module = "org.spongepowered:configurate-extra-kotlin", version.ref = "configurate" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
jnats = { module = "io.nats:jnats", version.ref = "jnats" }

# Protobuf
protoc = { module = "com.google.protobuf:protoc", version.ref = "protoc" }
protobuf-kotlin-lite = { module = "com.google.protobuf:protobuf-kotlin-lite", version.ref = "protobuf-kotlin" }

# Cloud Command
cloud-core = { module = "org.incendo:cloud-core", version.ref = "cloud" }
cloud-coroutines = { module = "org.incendo:cloud-kotlin-coroutines", version.ref = "cloud" }
cloud-velocity = { module = "org.incendo:cloud-velocity", version.ref = "cloud-platform" }
cloud-bungee = { module = "org.incendo:cloud-bungee", version.ref = "cloud-platform" }
cloud-paper = { module = "org.incendo:cloud-paper", version.ref = "cloud-platform" }
cloud-minestom = { module = "org.incendo:cloud-minestom", version.ref = "cloud-minestom" }

[bundles]
adventure = ["adventure", "adventure-text-minimessage", "adventure-text-serializer-plain", "adventure-text-serializer-legacy"]
configurate = ["configurate-yaml", "configurate-gson", "configurate-extra-kotlin"]
cloud = ["cloud-core", "cloud-coroutines"]

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
paperweight-userdev = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf" }
