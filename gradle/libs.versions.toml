[versions]
# Kotlin
kotlin = "2.4.21"
kotlinx-coroutines = "1.11.0"

# Gradle Plugins
shadow = "9.6.1"
minotaur = "2.10.0"
blossom = "2.2.0"
spotless = "8.10.4"
detekt = "2.0.0-alpha.6"
paperweight = "2.0.0-beta.24"
protobuf = "0.10.0"

# SimpleCloud
simplecloud-api = "0.1.0-platform.59-dev.6.1-9cfd057"

# Platforms
velocity = "4.1.0-SNAPSHOT"
bungeecord = "1.21-R0.4"
waterdog = "2.0.4-SNAPSHOT"
paper = "26.3.build.+"
minestom = "26_3-SNAPSHOT"

# Platform Dependencies
placeholderapi = "2.12.3"
miniplaceholders = "3.2.0"
luckperms = "5.5"
reflection-remapper = "0.1.3"

# Libraries
adventure = "5.2.0"
configurate = "4.2.0"
caffeine = "3.3.1"
slf4j = "2.0.20"
jnats = "2.26.3"

# Protobuf
protoc = "4.36.2"
protobuf-kotlin = "4.36.2"

# Cloud Command
cloud = "2.1.0"
cloud-platform = "2.0.1"
cloud-minestom = "2.2.0-SNAPSHOT"

# NPCs
# The NPC plugin's API floor: every NPC module but npc-provider-mannequin compiles against this,
# so the compiler rejects anything a supported server would not have.
npc-paper = "1.20.6-R0.1-SNAPSHOT"
# Mannequin entity API (1.21.9+); only npc-provider-mannequin compiles against this.
npc-paper-mannequin = "1.21.11-R0.1-SNAPSHOT"
# The Adventure that npc-paper-mannequin ships; npc-provider-mannequin compiles against it instead of the floor.
npc-adventure-mannequin = "4.26.1"
# What paper-api provides on the NPC floor. npc-conventions holds the compile classpath to it.
npc-adventure-floor = "4.17.0"
# The Adventure PacketEvents and EntityLib were built against. npc-packetevents ships it, relocated.
npc-adventure-packets = "4.26.1"
# The SimpleCloud API jar bundles Adventure without relocating it; newer builds bring Adventure 5,
# which would lift the NPC compile classpath above the floor.
npc-simplecloud-api = "0.1.0-platform.33-dev.52.1-9490b37"
npc-simplecloud-plugin = "0.0.1-platform.1778966459069-b1e45e2"
packetevents = "2.14.0"
# EntityLib only publishes snapshots; this is the 3.3.7 build, pinned so a release jar can be rebuilt.
entitylib = "3.3.7-20260731.141813-1"
citizens = "2.0.43-SNAPSHOT"
fancynpcs = "2.9.2"
mythic-dist = "5.12.1"
znpcsplus = "2.1.0-SNAPSHOT"

[libraries]
# Kotlin
kotlin-jvm = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

# Gradle Plugins
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
shadow-gradle-plugin = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "shadow" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
detekt-gradle-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
blossom-gradle-plugin = { module = "net.kyori:blossom", version.ref = "blossom" }
minotaur-gradle-plugin = { module = "com.modrinth.minotaur:Minotaur", version.ref = "minotaur" }

# SimpleCloud
simplecloud-api = { module = "app.simplecloud.api:api", version.ref = "simplecloud-api" }

# Platforms
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }
bungeecord-api = { module = "net.md-5:bungeecord-api", version.ref = "bungeecord" }
waterdog-api = { module = "dev.waterdog.waterdogpe:waterdog", version.ref = "waterdog" }
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
minestom = { module = "net.minestom:minestom", version.ref = "minestom" }

# Platform Dependencies
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
miniplaceholders-api = { module = "io.github.miniplaceholders:miniplaceholders-api", version.ref = "miniplaceholders" }
luckperms-api = { module = "net.luckperms:api", version.ref = "luckperms" }
reflection-remapper = { module = "xyz.jpenilla:reflection-remapper", version.ref = "reflection-remapper" }

# Libraries
adventure = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-text-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
adventure-text-serializer-gson = { module = "net.kyori:adventure-text-serializer-gson", version.ref = "adventure" }
adventure-text-serializer-plain = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "adventure" }
adventure-text-serializer-legacy = { module = "net.kyori:adventure-text-serializer-legacy", version.ref = "adventure" }
configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }
configurate-gson = { module = "org.spongepowered:configurate-gson", version.ref = "configurate" }
configurate-extra-kotlin = { module = "org.spongepowered:configurate-extra-kotlin", version.ref = "configurate" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
jnats = { module = "io.nats:jnats", version.ref = "jnats" }

# Protobuf
protoc = { module = "com.google.protobuf:protoc", version.ref = "protoc" }
protobuf-kotlin-lite = { module = "com.google.protobuf:protobuf-kotlin-lite", version.ref = "protobuf-kotlin" }

# Cloud Command
cloud-core = { module = "org.incendo:cloud-core", version.ref = "cloud" }
cloud-coroutines = { module = "org.incendo:cloud-kotlin-coroutines", version.ref = "cloud" }
cloud-velocity = { module = "org.incendo:cloud-velocity", version.ref = "cloud-platform" }
cloud-bungee = { module = "org.incendo:cloud-bungee", version.ref = "cloud-platform" }
cloud-paper = { module = "org.incendo:cloud-paper", version.ref = "cloud-platform" }
cloud-minestom = { module = "org.incendo:cloud-minestom", version.ref = "cloud-minestom" }
cloud-annotations = { module = "org.incendo:cloud-annotations", version.ref = "cloud" }

# NPCs
npc-paper-api = { module = "io.papermc.paper:paper-api", version.ref = "npc-paper" }
npc-paper-mannequin-api = { module = "io.papermc.paper:paper-api", version.ref = "npc-paper-mannequin" }
npc-simplecloud-api = { module = "app.simplecloud.api:api", version.ref = "npc-simplecloud-api" }
npc-simplecloud-plugin = { module = "app.simplecloud.plugin:plugin-shared", version.ref = "npc-simplecloud-plugin" }
npc-adventure-api = { module = "net.kyori:adventure-api", version.ref = "npc-adventure-packets" }
npc-adventure-text-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "npc-adventure-packets" }
npc-adventure-text-serializer-gson = { module = "net.kyori:adventure-text-serializer-gson", version.ref = "npc-adventure-packets" }
npc-adventure-text-serializer-legacy = { module = "net.kyori:adventure-text-serializer-legacy", version.ref = "npc-adventure-packets" }
npc-adventure-text-serializer-plain = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "npc-adventure-packets" }
npc-adventure-nbt = { module = "net.kyori:adventure-nbt", version.ref = "npc-adventure-packets" }
packetevents-spigot = { module = "com.github.retrooper:packetevents-spigot", version.ref = "packetevents" }
entitylib-spigot = { module = "io.github.tofaa2:spigot", version.ref = "entitylib" }
entitylib-api = { module = "io.github.tofaa2:api", version.ref = "entitylib" }
entitylib-common = { module = "io.github.tofaa2:common", version.ref = "entitylib" }
citizens-main = { module = "net.citizensnpcs:citizens-main", version.ref = "citizens" }
fancynpcs = { module = "de.oliver:FancyNpcs", version.ref = "fancynpcs" }
mythic-dist = { module = "io.lumine:Mythic-Dist", version.ref = "mythic-dist" }
znpcsplus-api = { module = "lol.pyr:znpcsplus-api", version.ref = "znpcsplus" }

[bundles]
adventure = ["adventure", "adventure-text-minimessage", "adventure-text-serializer-plain", "adventure-text-serializer-legacy"]
configurate = ["configurate-yaml", "configurate-gson", "configurate-extra-kotlin"]
cloud = ["cloud-core", "cloud-coroutines"]
# The NPC modules compile against these; npc-conventions holds them to the Adventure floor.
npc-adventure = ["npc-adventure-api", "npc-adventure-text-minimessage", "npc-adventure-text-serializer-legacy", "npc-adventure-text-serializer-plain"]
# What npc-packetevents bundles: everything PacketEvents and EntityLib reference.
npc-packet-adventure = ["npc-adventure-api", "npc-adventure-nbt", "npc-adventure-text-serializer-gson", "npc-adventure-text-serializer-legacy"]

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
paperweight-userdev = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf" }
