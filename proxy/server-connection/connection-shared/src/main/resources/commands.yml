# The config format version. Do not change this value.
version: 2

# ───────────────────────────────────────────────────────────────────────────────
# Commands
# Defines custom proxy commands that send players to configured target connections.
# Each command can have aliases, multiple prioritized targets, optional source filters,
# custom feedback messages, and an optional permission.
# ───────────────────────────────────────────────────────────────────────────────
commands:
  - name: lobby
    # Alternative command names that behave like the main command.
    aliases:
      - l
      - hub
      - quit
      - leave
    # Leave empty to allow every player to use this command.
    permission: ''
    # Connection targets to try. Higher priority values are tried first.
    target-connections:
      - name: lobby
        priority: 0
        # Optional source filters. Leave empty to allow this target from anywhere.
        from: []
    # Command-specific feedback messages.
    messages:
      already-connected: '<prefix> <warning>You are already in the lobby.'
      no-target-connection-found: '<prefix> <error>There is no lobby available right now.'
