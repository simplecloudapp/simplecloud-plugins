# The messages format version. Do not change this value.
version: 2

# ───────────────────────────────────────────────────────────────────────────────
# Palette
# Colors used throughout the messages. Every entry is a tag, e.g. <brand>text or <error>text.
# ───────────────────────────────────────────────────────────────────────────────
palette:
  brand: '#3B95FF'
  interactive: '#62ADFF'
  highlight: '#CFE4FF'
  muted: '#A1A7B5'
  separator: '#5F5F63'
  info: '#4FA3FF'
  success: '#6AD13C'
  warning: '#FF9029'
  error: '#FF3B30'
  mint: '#1FD98E'
  violet: '#9566FF'
  pink: '#E94BA6'
  gold: '#F2C230'
  cyan: '#22C3DB'
  amber: '#FFA329'

# ───────────────────────────────────────────────────────────────────────────────
# Variables
# Reusable variables that can be used throughout the messages.
# Usage: <variable_name> will be replaced with the defined value.
# ───────────────────────────────────────────────────────────────────────────────
variables:
  prefix: '<brand><b>⚡</b></brand>'

# ───────────────────────────────────────────────────────────────────────────────
# Kick Messages
# ───────────────────────────────────────────────────────────────────────────────
kick:
  # Shown when a player is kicked from a server and there is no fallback server.
  # Placeholders: <reason> (the kick reason of the server, empty if there is none), <server> (the server the player was kicked from)
  no-fallback-servers: '<error>There is no server to send you to.<br><br><reason><br><muted>Try again in a few seconds.'
  no-target-connection: '<error>There is no server to join right now.<br><br><muted>Try again in a few seconds.'
