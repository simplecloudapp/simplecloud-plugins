config-version: '2'

# ───────────────────────────────────────────────────────────────────────────────
# Server List Layout
# Configures how your server appears in the multiplayer server list,
# including MOTD, server icon, and player count display.
#
# Read more @ https://docs.simplecloud.app/manual/plugins/proxy-essentials
# ───────────────────────────────────────────────────────────────────────────────
motd:
  enabled: true
  # QUEUE, RANDOM
  update-type: RANDOM
  #update-type: QUEUE
  # Interval in ticks after which the next entry is shown. Without it, the entry changes on every ping.
  # Set to 0 to always show the first entry.
  #update-time: 100
  # Wrap a line in <center>...</center> to center it using vanilla font metrics.
  layouts:
    - name: public
      line1: '<center><brand>SimpleCloud</center>'
      line2: '<center><muted>ᴀ ɴᴇᴛᴡᴏʀᴋ ᴘᴏᴡᴇʀᴇᴅ ʙʏ ꜱɪᴍᴘʟᴇᴄʟᴏᴜᴅ.ᴀᴘᴘ</center>'

server-icon:
  enabled: true
  file: 'simplecloud.png'

# Text displayed when hovering over the player count in the server list.
player-list:
  enabled: true
  player-list:
    - ''
    - '<muted>ꜱɪᴍᴘʟᴇᴄʟᴏᴜᴅ.ᴀᴘᴘ'
    - ''

# Server version text and player slots configuration.
version:
  name:
    enabled: false
    text: 'Example'
  slots:
    enabled: true
    # REAL - Displays the actual number of online players
    # FAKE - Displays a fixed custom number of online players
    # DYNAMIC - Displays a dynamic number based on actual players plus a range
    type: REAL
    #type: FAKE
    #fake-slots: 100
    #type: DYNAMIC
    #dynamic-player-range: 5
