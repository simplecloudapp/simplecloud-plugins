config-version: '2'

# ───────────────────────────────────────────────────────────────────────────────
# Server List Layout
# Configures how your server appears in the multiplayer server list,
# including MOTD, server icon, and player count display.
#
# Read more @ https://docs.simplecloud.app/manual/plugins/proxy-essentials
# ───────────────────────────────────────────────────────────────────────────────
motd:
  enabled: true
  # QUEUE, RANDOM
  update-type: RANDOM
  #update-type: QUEUE
  # Interval in ticks after which the next entry is shown. Without it, the entry changes on every ping.
  # Set to 0 to always show the first entry.
  #update-time: 100
  # Wrap a line in <center>...</center> to center it using vanilla font metrics.
  layouts:
    - name: maintenance
      line1: '<center><brand>ꜱɪᴍᴘʟᴇᴄʟᴏᴜᴅ</center>'
      line2: '<center><warning>In maintenance, back soon.</center>'

server-icon:
  enabled: true
  file: 'simplecloud-gray.png'

# Text displayed when hovering over the player count in the server list.
player-list:
  enabled: true
  player-list:
    - ''
    - '<muted>simplecloud.app'
    - ''

# Server version text and player slots configuration.
version:
  name:
    enabled: true
    text: '<warning>Maintenance'
  slots:
    # Set to false to keep the max players that the proxy, or another plugin, puts in the server list.
    enabled: true
    # REAL - Shows the max players counted by player-count in config.yml
    # FAKE - Shows a fixed number as the max players
    # DYNAMIC - Shows the online players plus a range as the max players
    type: REAL
    #type: FAKE
    #fake-slots: 100
    #type: DYNAMIC
    #dynamic-player-range: 5
