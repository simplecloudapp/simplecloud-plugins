# The messages format version. Do not change this value.
version: 1

# ───────────────────────────────────────────────────────────────────────────────
# Format
# Controls how values inside messages are formatted.
# ───────────────────────────────────────────────────────────────────────────────
format:
  # Pattern used for the <time>, <create_date> and <updated> placeholders.
  # See java.time.format.DateTimeFormatter for all available pattern letters.
  date: 'dd.MM.yyyy HH:mm:ss'

# ───────────────────────────────────────────────────────────────────────────────
# Palette
# Colors used throughout the messages. Every entry is a tag, e.g. <brand>text or <error>text.
# ───────────────────────────────────────────────────────────────────────────────
palette:
  brand: '#3B95FF'
  interactive: '#62ADFF'
  highlight: '#CFE4FF'
  muted: '#A8A8AB'
  separator: '#5F5F63'
  info: '#4FA3FF'
  success: '#6AD13C'
  warning: '#FF9029'
  error: '#F5464F'
  mint: '#1FD98E'
  violet: '#9566FF'
  pink: '#E94BA6'
  gold: '#F2C230'
  cyan: '#22C3DB'
  amber: '#FFA329'

# ───────────────────────────────────────────────────────────────────────────────
# Variables
# Reusable variables that can be used throughout the messages.
# Usage: <variable_name> will be replaced with the defined value.
# ───────────────────────────────────────────────────────────────────────────────
variables:
  prefix: '<brand><b>⚡</b></brand>'

# ───────────────────────────────────────────────────────────────────────────────
# Command Messages
# ───────────────────────────────────────────────────────────────────────────────
command:
  # Overview of all commands the sender is allowed to use.
  # Placeholders: <command>
  help:
    title: '<prefix> <info>Notify commands'
    entry: '<separator>•</separator> <interactive><command></interactive> <muted><arguments>'
    hover: '<interactive>Click to type this command'
    empty: '<prefix> <warning>You can''t use any notify commands.'

  # Shown when a command fails or is used wrong.
  # Placeholders: <command>, <reason>, <value>, <min>, <max>, <options>
  exception:
    syntax: '<prefix> <error>Use <command> instead.'
    permission: '<prefix> <error>You don''t have permission to use this command.'
    invalid-sender: '<prefix> <error>You can''t use this command here.'
    failed: '<prefix> <error>The command failed because <reason>.'
    argument:
      invalid: '<prefix> <error>That argument is invalid: <reason>.'
      invalid-number: '<prefix> <error><value> is not a number.'
      number-too-small: '<prefix> <error>The number must be at least <min>.'
      number-too-large: '<prefix> <error>The number must be at most <max>.'
      invalid-boolean: '<prefix> <error>Use true or false.'
      invalid-enum: '<prefix> <error><value> is not an option. Use one of <options>.'
      invalid-uuid: '<prefix> <error><value> is not a valid UUID.'

  # Confirmation for a player who toggles their own notifications.
  # Placeholders: <type>
  notify:
    enabled: '<prefix> <success>Server notifications are now enabled.'
    disabled: '<prefix> <success>Server notifications are now disabled.'
    already-enabled: '<prefix> <warning>Server notifications are already enabled.'
    already-disabled: '<prefix> <warning>Server notifications are already disabled.'
    type:
      enabled: '<prefix> <success><type> notifications are now enabled.'
      disabled: '<prefix> <success><type> notifications are now disabled.'
      already-enabled: '<prefix> <warning><type> notifications are already enabled.'
      already-disabled: '<prefix> <warning><type> notifications are already disabled.'

  # Confirmation for an admin who toggles the notifications of another player.
  # Placeholders: <playername>, <displayname>, <type>
  set:
    enabled: '<prefix> <success>Server notifications are now enabled for <white><head:<playername>:true></white> <displayname>.'
    disabled: '<prefix> <success>Server notifications are now disabled for <white><head:<playername>:true></white> <displayname>.'
    already-enabled: '<prefix> <warning>Server notifications are already enabled for <white><head:<playername>:true></white> <displayname>.'
    already-disabled: '<prefix> <warning>Server notifications are already disabled for <white><head:<playername>:true></white> <displayname>.'
    type:
      enabled: '<prefix> <success><type> notifications are now enabled for <white><head:<playername>:true></white> <displayname>.'
      disabled: '<prefix> <success><type> notifications are now disabled for <white><head:<playername>:true></white> <displayname>.'
      already-enabled: '<prefix> <warning><type> notifications are already enabled for <white><head:<playername>:true></white> <displayname>.'
      already-disabled: '<prefix> <warning><type> notifications are already disabled for <white><head:<playername>:true></white> <displayname>.'

  # Overview of all notification types and their current state.
  # Each entry can be clicked to toggle the type.
  # Placeholders (entry): <type>, <state>, <toggle>
  #   <state>  - Replaced with the "enabled" or "disabled" value below.
  #   <toggle> - Click action that runs the matching enable/disable command.
  list:
    title: '<prefix> <info>Your notifications'
    entry: '<toggle><hover:show_text:''<interactive>Click to toggle''><separator>•</separator> <interactive><type> <separator>(</separator><state><separator>)</separator></hover></toggle>'
    enabled: '<success>enabled'
    disabled: '<error>disabled'
    empty: '<prefix> <warning>There are no notifications for you.'

  # Result of reloading this file.
  reload:
    config:
      success: '<prefix> <success>Reloaded the notify configuration!'
      failed: '<prefix> <error>Couldn''t reload the notify configuration. Check the console.'

  # Errors that can occur while running a command.
  # Placeholders: <playername>, <type>
  error:
    player-not-found: '<prefix> <error>Player <playername> was not found.'
    player-not-online: '<prefix> <error>Player <playername> is not online.'
    only-players: '<prefix> <error>Only players can use this command.'
    storage-unavailable: '<prefix> <error>Notification settings are unavailable right now. Try again later.'
    unknown-type: '<prefix> <error><type> is not a notification type. Use /scnotify list.'
    internal: '<prefix> <error>Something went wrong. Try again later.'

# ───────────────────────────────────────────────────────────────────────────────
# Notifications
# Messages broadcast to every online player that has the matching permission
# and has not disabled the notification type.
# ───────────────────────────────────────────────────────────────────────────────
notifications:
  # Display names of the notification types.
  # Used for the <type> placeholder in command messages.
  types:
    server.starting: 'Server starting'
    server.available: 'Server available'
    server.stopping: 'Server stopping'
    server.stopped: 'Server stopped'
    group.created: 'Group created'
    group.deleted: 'Group deleted'
    persistent-server.created: 'Persistent server created'
    persistent-server.deleted: 'Persistent server deleted'

  # Hover texts that can be inserted into notifications with
  # <hover:show_text:'<notifications.hover.server>'>, ...group> or ...persistent-server>.
  # Each hover supports the same placeholders as the notification it is used in.
  hover:
    server: |-
      <brand><server>
      <br><muted>State: <highlight><state>
      <br><muted>Address: <highlight><ip>:<port>
      <br><muted>Players: <highlight><players>/<max>
      <br><muted>Time: <highlight><time>
    group: |-
      <brand><group>
      <br><muted>Time: <highlight><time>
    persistent-server: |-
      <brand><server>
      <br><muted>Time: <highlight><time>

  # Sent when a server changes its state.
  # Placeholders:
  #   <server>      - Name of the server, e.g. lobby-1.
  #   <id>          - Numerical id of the server, prefixed with a space.
  #   <group>       - Name of the server's group.
  #   <uuid>        - Unique id of the server.
  #   <state>       - New state of the server.
  #   <ip>, <port>  - Address of the server.
  #   <players>     - Current player count.
  #   <max>         - Maximum player count.
  #   <time>        - Time of the notification.
  #   <create_date> - Time the server was created.
  #   <updated>     - Time the server was last updated.
  server:
    starting: '<prefix> <info>Server <hover:show_text:''<notifications.hover.server>''><server></hover> is starting.'
    available: '<prefix> <success>Server <hover:show_text:''<notifications.hover.server>''><server></hover> is now available.'
    stopping: '<prefix> <info>Server <hover:show_text:''<notifications.hover.server>''><server></hover> is stopping.'
    stopped: '<prefix> <muted>Server <hover:show_text:''<notifications.hover.server>''><server></hover> has stopped.'

  # Sent when a server group is created or deleted.
  # Placeholders: <group>, <time>
  group:
    created: '<prefix> <info>Group <hover:show_text:''<notifications.hover.group>''><group></hover> was created.'
    deleted: '<prefix> <muted>Group <hover:show_text:''<notifications.hover.group>''><group></hover> was deleted.'

  # Sent when a persistent server is created or deleted.
  # Placeholders: <server>, <time>
  persistent-server:
    created: '<prefix> <info>Persistent server <hover:show_text:''<notifications.hover.persistent-server>''><server></hover> was created.'
    deleted: '<prefix> <muted>Persistent server <hover:show_text:''<notifications.hover.persistent-server>''><server></hover> was deleted.'
