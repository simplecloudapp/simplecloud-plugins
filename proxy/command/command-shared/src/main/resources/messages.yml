# The messages format version. Do not change this value.
version: 1

# ───────────────────────────────────────────────────────────────────────────────
# Palette
# Colors used throughout the messages. Every entry is a tag, e.g. <brand>text or <error>text.
# ───────────────────────────────────────────────────────────────────────────────
palette:
  brand: '#3B95FF'
  interactive: '#62ADFF'
  highlight: '#CFE4FF'
  muted: '#A1A7B5'
  separator: '#5F5F63'
  info: '#4FA3FF'
  success: '#6AD13C'
  warning: '#FF9029'
  error: '#FF3B30'
  mint: '#1FD98E'
  violet: '#9566FF'
  pink: '#E94BA6'
  gold: '#F2C230'
  cyan: '#22C3DB'
  amber: '#FFA329'

# ───────────────────────────────────────────────────────────────────────────────
# Variables
# Reusable variables that can be used throughout the messages.
# Usage: <variable_name> will be replaced with the defined value.
# ───────────────────────────────────────────────────────────────────────────────
variables:
  prefix: '<brand><b>⚡</b></brand>'

# ───────────────────────────────────────────────────────────────────────────────
# Command Messages
# Placeholders like <group>, <playername> or <reason> are filled in by the plugin.
# ───────────────────────────────────────────────────────────────────────────────
command:
  # Shown on /cloud
  help:
    title: '<prefix> <info>Cloud commands'
    entry: '<separator>•</separator> <interactive><command></interactive> <muted><arguments>'
    hover: '<interactive>Click to type this command'
    empty: '<prefix> <warning>You can''t use any cloud commands.'

  # Shown when a command is used with wrong arguments
  usage:
    invalid-target-type: '<prefix> <error>Use group or ps as the target type.'

  # /cloud group ...
  group:
    list:
      title: '<prefix> <info>Groups <separator>(</separator><count><separator>)</separator>'
      entry: '<separator>•</separator> <info><group> <separator>(</separator><online>/<total> online<separator>)</separator>'
      empty: '<prefix> <warning>No groups were found.'
    info:
      title: '<prefix> <info>Group <group>'
      entry: '<separator>•</separator> <info><key><separator>:</separator> <value>'
    start:
      success: '<prefix> <info>Sent the start request for <count> servers of group <group>.'
      partial: '<prefix> <warning>Started only <count>/<total> servers for group <group> because <reason>.'
    stop:
      success: '<prefix> <info>Sent the stop request for the servers of group <group>.'
      success-with-ids: '<prefix> <info>Sent the stop request for servers <ids> of group <group>.'
      partial: '<prefix> <warning>Stopped only <count>/<total> servers of group <group> because <reason>.'
    error:
      not-found: '<prefix> <error>Group <group> was not found.'
      already-empty: '<prefix> <warning>Group <group> has no running servers.'
      start-failed: '<prefix> <error>Couldn''t start servers for group <group> because <reason>.'
      stop-failed: '<prefix> <error>Couldn''t stop the servers of group <group> because <reason>.'

  # /cloud server ...
  server:
    list:
      title: '<prefix> <info>Servers <separator>(</separator><count><separator>)</separator>'
      entry: '<separator>•</separator> <info><server> <separator>(</separator><value><separator>)</separator>'
      empty: '<prefix> <warning>No running servers were found.'
    info:
      title: '<prefix> <info>Server <server>'
      entry: '<separator>•</separator> <info><key><separator>:</separator> <value>'
    start:
      requested: '<prefix> <info>Sent the start request for a new server of group <group>.'
    stop:
      success: '<prefix> <info>Sent the stop request for server <group>-<id>.'
    error:
      not-found: '<prefix> <error>Server <group>-<id> was not found.'
      already-stopping: '<prefix> <warning>Server <group>-<id> is already stopping.'
      start-failed: '<prefix> <error>Couldn''t queue a new server for group <group> because <reason>.'
      stop-failed: '<prefix> <error>Couldn''t stop server <group>-<id> because <reason>.'

  # /cloud player ...
  # <head:<playername>:true> shows the head of the player
  player:
    list:
      title: '<prefix> <info>Players <separator>(</separator><count><separator>)</separator>'
      entry: '<separator>•</separator> <info><white><head:<playername>:true></white> <displayname> <separator>(</separator><value><separator>)</separator>'
      empty: '<prefix> <warning>No players were found on this target.'
    info:
      title: '<prefix> <info>Player <white><head:<playername>:true></white> <displayname>'
      entry: '<separator>•</separator> <info><key><separator>:</separator> <value>'
    send:
      success: '<prefix> <success>Sent <white><head:<playername>:true></white> <displayname> to <target>.'
      success-all: '<prefix> <success>Sent <count> players to <target>.'
      success-from-server: '<prefix> <success>Sent <count> players from <source> to <target>.'
    message:
      success: '<prefix> <success>Sent your message to <white><head:<playername>:true></white> <displayname>.'
    error:
      not-found: '<prefix> <error>Player <playername> was not found.'
      not-online: '<prefix> <error>Player <playername> is not online.'
      same-target: '<prefix> <warning><white><head:<playername>:true></white> <displayname> is already on <target>.'
      target-not-found: '<prefix> <error>Target <target> was not found.'
      source-not-found: '<prefix> <error>Source <source> was not found.'
      send-failed: '<prefix> <error>Couldn''t send <white><head:<playername>:true></white> <displayname> to <target>.'
      send-all-failed: '<prefix> <error>Couldn''t send the players to <target>.'
      no-online-players: '<prefix> <warning>No players are online.'
      all-on-target: '<prefix> <warning>All players are already on <target>.'
      no-source-players: '<prefix> <warning>No players are on <source>.'
      message-empty: '<prefix> <error>Write a message for <playername>.'
      message-failed: '<prefix> <error>Couldn''t send the message to <playername>.'

  # /cloud reload
  reload:
    success: '<prefix> <success>Reloaded the cloud commands!'
    failed: '<prefix> <error>Couldn''t reload the cloud commands. Check the console.'

  # Shown when a command fails or is used wrong
  # Placeholders: <command>, <reason>, <value>, <min>, <max>, <options>
  exception:
    syntax: '<prefix> <error>Use <command> instead.'
    permission: '<prefix> <error>You don''t have permission to use this command.'
    invalid-sender: '<prefix> <error>You can''t use this command here.'
    failed: '<prefix> <error>The command failed because <reason>.'
    argument:
      invalid: '<prefix> <error>That argument is invalid: <reason>.'
      invalid-number: '<prefix> <error><value> is not a number.'
      number-too-small: '<prefix> <error>The number must be at least <min>.'
      number-too-large: '<prefix> <error>The number must be at most <max>.'
      invalid-boolean: '<prefix> <error>Use true or false.'
      invalid-enum: '<prefix> <error><value> is not an option. Use one of <options>.'
      invalid-uuid: '<prefix> <error><value> is not a valid UUID.'
