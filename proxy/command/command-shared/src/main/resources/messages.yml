# The messages format version. Do not change this value.
version: 2

# ───────────────────────────────────────────────────────────────────────────────
# Palette
# Colors used throughout the messages. Every entry is a tag, e.g. <brand>text or <error>text.
# ───────────────────────────────────────────────────────────────────────────────
palette:
  brand: '#3B95FF'
  interactive: '#62ADFF'
  highlight: '#CFE4FF'
  muted: '#A1A7B5'
  separator: '#5F5F63'
  info: '#4FA3FF'
  success: '#6AD13C'
  warning: '#FF9029'
  error: '#FF3B30'
  mint: '#1FD98E'
  violet: '#9566FF'
  pink: '#E94BA6'
  gold: '#F2C230'
  cyan: '#22C3DB'
  amber: '#FFA329'

# ───────────────────────────────────────────────────────────────────────────────
# Variables
# Reusable variables that can be used throughout the messages.
# Usage: <variable_name> will be replaced with the defined value.
# ───────────────────────────────────────────────────────────────────────────────
variables:
  prefix: '<brand><b>⚡</b></brand>'

# ───────────────────────────────────────────────────────────────────────────────
# Command Messages
# Placeholders like <group>, <playername> or <reason> are filled in by the plugin.
# ───────────────────────────────────────────────────────────────────────────────
command:
  # Shown on /cloud
  help:
    title: '<prefix> <info>Cloud commands  <separator>/cloud'
    entry: '   <interactive><subcommand></interactive> <muted><arguments>'
    hover: '<highlight><description><br><muted>Usage: <highlight><usage><br><br><interactive>Click to type this command'
    empty: '<prefix> <warning>You can''t use any cloud commands.'
    # Shown next to each command and in its hover, keyed by the usage without /cloud.
    descriptions:
      'group list': 'List all groups'
      'group info <group>': 'Show a group'
      'group start <group> [count]': 'Start servers of a group'
      'group stop <group> [ids]': 'Stop servers of a group'
      'group rollout <group>': 'Restart a group server by server'
      'group rollout <group> status': 'Show the rollout of a group'
      'group rollout <group> cancel': 'Cancel the rollout of a group'
      'group queue <group>': 'Show the start queue of a group'
      'group queue <group> clear': 'Clear the start queue of a group'
      'group enable <group>': 'Enable a group so it starts servers'
      'group disable <group>': 'Disable a group and stop its servers'
      'server list [group] [page]': 'List the running servers'
      'server info <server>': 'Show a server'
      'server start <group>': 'Start a new server'
      'server stop <server>': 'Stop a server'
      'server command <server> <command>': 'Run a console command on a server'
      'ps list': 'List all persistent servers'
      'ps info <name>': 'Show a persistent server'
      'ps enable <name>': 'Enable and start a persistent server'
      'ps disable <name>': 'Disable and stop a persistent server'
      'player list [<group|ps|server> <target>] [page]': 'List the online players'
      'player info <player>': 'Show a player'
      'player send <player> <group|ps|server> <target> [mode]': 'Send a player to a target'
      'player sendall <group|ps|server> <target> [mode]': 'Send all players to a target'
      'player sendfrom <source> <group|ps|server> <target> [mode]': 'Move the players of a source'
      'player message <player> <message>': 'Send a player a message'
      'player kick <player> [reason]': 'Kick a player from the network'
      'info': 'Show the network stats'
      'reload': 'Reload the messages'

  # Shown below lists with more than one page
  page:
    footer: '<previous><info>Page <page>/<pages><next>'
    previous: '<interactive>Previous</interactive>  '
    next: '  <interactive>Next'

  # Shown when a command is used with wrong arguments
  usage:
    invalid-target-type: '<prefix> <error>Use group, ps or server as the target type.'
    mode-only-for-groups: '<prefix> <error>A selection mode only works with a group as the target.'

  # /cloud group ...
  group:
    list:
      title: '<prefix> <info>Groups <separator>(</separator><muted><count></muted><separator>)</separator>'
      entry: '<separator>•</separator> <highlight><group> <separator>(</separator><muted><online>/<total> online</muted><separator>)</separator>'
      empty: '<prefix> <warning>No groups were found.'
    info:
      title: '<prefix> <info>Group <group>'
      entry: '<separator>•</separator> <muted><key><separator>:</separator> <highlight><value>'
    start:
      success: '<prefix> <info>Sent the start request for <count> servers of group <group>.'
      partial: '<prefix> <warning>Started only <count>/<total> servers for group <group> because <reason>.'
    stop:
      success: '<prefix> <info>Sent the stop request for <count> servers of group <group>.'
      success-with-ids: '<prefix> <info>Sent the stop request for servers <ids> of group <group>.'
      partial: '<prefix> <warning>Stopped only <count>/<total> servers of group <group> because <reason>.'
    # /cloud group rollout <group> [status|cancel]
    rollout:
      started: '<prefix> <success>Started the rollout of group <group>.'
      cancelled: '<prefix> <success>Cancelled the rollout of group <group>.'
      status:
        title: '<prefix> <info>Rollout of group <group>'
        entry: '<separator>•</separator> <muted><key><separator>:</separator> <highlight><value>'
        inactive: '<prefix> <warning>Group <group> has no active rollout.'
      error:
        already-active: '<prefix> <warning>Group <group> already has an active rollout.'
        no-servers: '<prefix> <warning>Group <group> has no running servers to roll out.'
        not-active: '<prefix> <warning>Group <group> has no active rollout to cancel.'
    # /cloud group queue <group> [clear]
    queue:
      title: '<prefix> <info>Start queue of group <group> <separator>(</separator><muted><count></muted><separator>)</separator>'
      entry: '<separator>•</separator> <muted><key><separator>:</separator> <highlight><value>'
      pending: '<separator>•</separator> <muted>Pending since <highlight><date>'
      failed: '<separator>•</separator> <muted>Failed at <highlight><date></highlight> <separator>(</separator><error><reason></error><separator>)</separator>'
      more: '<separator>•</separator> <muted>... and <count> more'
      empty: '<prefix> <warning>The start queue of group <group> is empty.'
      cleared: '<prefix> <success>Cleared <count> queued starts of group <group>.'
      already-empty: '<prefix> <warning>The start queue of group <group> is already empty.'
    # /cloud group enable|disable <group>
    activation:
      enabled: '<prefix> <success>Enabled group <group>, it starts servers again.'
      disabled: '<prefix> <success>Disabled group <group>, its servers are stopping.'
      already-enabled: '<prefix> <warning>Group <group> is already enabled.'
      already-disabled: '<prefix> <warning>Group <group> is already disabled.'
    error:
      not-found: '<prefix> <error>Group <group> was not found.'
      already-empty: '<prefix> <warning>Group <group> has no running servers.'
      start-failed: '<prefix> <error>Couldn''t start servers for group <group> because <reason>.'
      stop-failed: '<prefix> <error>Couldn''t stop the servers of group <group> because <reason>.'
      limit-reached: '<prefix> <warning>Group <group> can only start <available> more servers <separator>(</separator><muted><running>/<max> running or queued</muted><separator>)</separator>.'
      invalid-ids: '<prefix> <error><ids> are not valid server ids.'
      servers-not-found: '<prefix> <error>Servers <ids> of group <group> were not found.'
      already-stopping: '<prefix> <warning>Servers <ids> of group <group> are already stopping.'

  # /cloud server ...
  server:
    list:
      title: '<prefix> <info>Servers <separator>(</separator><muted><count></muted><separator>)</separator>'
      entry: '<separator>•</separator> <highlight><server> <separator>(</separator><muted><value></muted><separator>)</separator>'
      empty: '<prefix> <warning>No running servers were found.'
    info:
      title: '<prefix> <info>Server <server>'
      entry: '<separator>•</separator> <muted><key><separator>:</separator> <highlight><value>'
    start:
      requested: '<prefix> <info>Sent the start request for a new server of group <group>.'
    stop:
      success: '<prefix> <info>Sent the stop request for server <server>.'
    command:
      success: '<prefix> <success>Sent <highlight><command></highlight> to server <server>.'
    error:
      not-found: '<prefix> <error>Server <server> was not found.'
      already-stopping: '<prefix> <warning>Server <server> is already stopping.'
      command-empty: '<prefix> <error>Write a command for server <server>.'

  # /cloud ps ...
  persistent-server:
    list:
      title: '<prefix> <info>Persistent servers <separator>(</separator><muted><count></muted><separator>)</separator>'
      entry: '<separator>•</separator> <highlight><server> <separator>(</separator><muted><value></muted><separator>)</separator>'
      empty: '<prefix> <warning>No persistent servers were found.'
    info:
      title: '<prefix> <info>Persistent server <server>'
      entry: '<separator>•</separator> <muted><key><separator>:</separator> <highlight><value>'
    # /cloud ps enable|disable <name>
    activation:
      enabled: '<prefix> <success>Enabled persistent server <server>, it is starting.'
      disabled: '<prefix> <success>Disabled persistent server <server>, it is stopping.'
      already-enabled: '<prefix> <warning>Persistent server <server> is already enabled.'
      already-disabled: '<prefix> <warning>Persistent server <server> is already disabled.'
    error:
      not-found: '<prefix> <error>Persistent server <server> was not found.'

  # /cloud player ...
  # <head:<playername>:true> shows the head of the player
  player:
    list:
      title: '<prefix> <info>Players <separator>(</separator><muted><count></muted><separator>)</separator>'
      entry: '<separator>•</separator> <highlight><white><head:<playername>:true></white> <displayname> <separator>(</separator><muted><value></muted><separator>)</separator>'
      empty: '<prefix> <warning>No players were found.'
    info:
      title: '<prefix> <info>Player <white><head:<playername>:true></white> <displayname>'
      entry: '<separator>•</separator> <muted><key><separator>:</separator> <highlight><value>'
    send:
      success: '<prefix> <success>Sent <white><head:<playername>:true></white> <displayname> to <target>.'
      success-all: '<prefix> <success>Sent <count> players to <target>.'
      success-from-server: '<prefix> <success>Sent <count> players from <source> to <target>.'
    message:
      success: '<prefix> <success>Sent your message to <white><head:<playername>:true></white> <displayname>.'
    kick:
      success: '<prefix> <success>Kicked <white><head:<playername>:true></white> <displayname>.'
    error:
      not-found: '<prefix> <error>Player <playername> was not found.'
      not-online: '<prefix> <error>Player <playername> is not online.'
      same-target: '<prefix> <warning><white><head:<playername>:true></white> <displayname> is already on <target>.'
      target-not-found: '<prefix> <error>Target <target> was not found.'
      source-not-found: '<prefix> <error>Source <source> was not found.'
      send-failed: '<prefix> <error>Couldn''t send <white><head:<playername>:true></white> <displayname> to <target>.'
      send-all-failed: '<prefix> <error>Couldn''t send the players to <target>.'
      no-online-players: '<prefix> <warning>No players are online.'
      all-on-target: '<prefix> <warning>All players are already on <target>.'
      no-source-players: '<prefix> <warning>No players are on <source>.'
      message-empty: '<prefix> <error>Write a message for <playername>.'

  # /cloud info
  info:
    title: '<prefix> <info>Cloud network'
    entry: '<separator>•</separator> <muted><key><separator>:</separator> <highlight><value>'

  # /cloud reload
  reload:
    success: '<prefix> <success>Reloaded the cloud commands!'
    failed: '<prefix> <error>Couldn''t reload the cloud commands. Check the console.'

  # Shown when a command fails or is used wrong
  # Placeholders: <command>, <reason>, <value>, <min>, <max>, <options>
  exception:
    syntax: '<prefix> <error>Use <command> instead.'
    permission: '<prefix> <error>You don''t have permission to use this command.'
    invalid-sender: '<prefix> <error>You can''t use this command here.'
    failed: '<prefix> <error>The command failed because <reason>.'
    argument:
      invalid: '<prefix> <error>That argument is invalid: <reason>.'
      invalid-number: '<prefix> <error><value> is not a number.'
      number-too-small: '<prefix> <error>The number must be at least <min>.'
      number-too-large: '<prefix> <error>The number must be at most <max>.'
      invalid-boolean: '<prefix> <error>Use true or false.'
      invalid-enum: '<prefix> <error><value> is not an option. Use one of <options>.'
      invalid-uuid: '<prefix> <error><value> is not a valid UUID.'
